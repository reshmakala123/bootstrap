<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Feedback Form</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">Bakery Feedback Form</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Feedback</label>
                            <textarea class="form-control" rows="4"
                                placeholder="Write your feedback"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preferred Contact Method</label>

                            <div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                        name="contact" id="email">
                                    <label class="form-check-label" for="email">
                                        Email
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                        name="contact" id="phone">
                                    <label class="form-check-label" for="phone">
                                        Phone
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Satisfaction -->
                        <div class="mb-3">
                            <label class="form-label">
                                Satisfaction Level (1–10)
                            </label>

                            <input type="range" class="form-range"
                                min="1" max="10">
                        </div>

                        <!-- Order Type -->
                        <div class="mb-3">
                            <label class="form-label">Type of Order</label>

                            <select class="form-select">
                                <option selected>Select order type</option>
                                <option>Cake</option>
                                <option>Cookies</option>
                                <option>Pastries</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">
                                Submit Feedback
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
